site_name: Coregix
site_url: https://coregix.sefa.ai
repo_url: https://github.com/iosefa/coregix

theme:
    name: material
    palette:
        primary: teal
        accent: deep-orange
    icon:
        repo: fontawesome/brands/github
    features:
        - navigation.instant
        - navigation.sections
        - search.highlight
        - search.suggest

plugins:
    - search
    - mkdocstrings:
        handlers:
            python:
                options:
                    docstring_style: google
                    show_source: true
                    show_root_heading: true
                    show_symbol_type_heading: true

markdown_extensions:
    - admonition
    - attr_list
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight:
          linenums: true
    - toc:
          permalink: true

nav:
    - Home: index.md
    - Installation: installation.md
    - Concepts: concepts.md
    - Usage:
        - Align Image Pairs: usage/alignment.md
        - Large Rasters: usage/large-rasters.md
        - Vector Alignment Evaluation: usage/vector-alignment.md
        - Edge Trimming: usage/edge-trimming.md
    - API Reference:
        - Overview: api/index.md
        - Alignment: api/alignment.md
        - Apply Transform: api/apply-transform.md
        - Evaluation: api/evaluation.md
        - Edge Trimming: api/edge-trimming.md
        - Advanced Registration: api/registration.md
